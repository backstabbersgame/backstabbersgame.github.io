ssa confusão precisa de uma solução, agora você deve provar sua honra, mostrando que você  não é o culpado.\"},\"Backstabbers\":{\"title\":\"Backstabbers\",\"description\":\"Em uma sociedade onde cada um quer ser mais poderoso que o outro e onde seus desejos são maiores que o próximo, ninguém medirá seus esforços para atingir seus objetivos. Não confie em ninguém, nem mesmo em você!\"},\"Decodica\":{\"title\":\"Decodica\",\"description\":\"DecoDica é um party ou social game super versátil que pode ser jogado de 5 formas distintas, onde os jogadores são desafiados a trabalhar sua criatividade, velocidade e capacidade de interpretação.\"},\"Ordem\":{\"title\":\"Ordem ao Caos\",\"description\":\"Tentando se tornar a nova líder da Gangue dos Gatos, Catuaba colocou em prática uma estratégia para aumentar sua influência: desestabilizar a Armada dos Cães. Mas seus planos ruíram quando a Armada descobriu que o cocô no pátio era, na verdade, felino! Mesmo com o culpado revelado, o caos se instaurou. Agora, com ambos os grupos em conflito interno e externo, Nala e Valerius não veem outra alternativa: é hora de unirem forças para restabelecer a paz. Você deve interferir na confusão e pôr um fim a essa guerra — interna aos grupos e entre as espécies.\"},\"Rebeliao\":{\"title\":\"Rebelião dos Gatos\",\"description\":\"A gangue dos gatos organizou uma rebelião contra o comando da chefe Nala, montando um golpe que tirou a grande felina do poder. Agora as facções estão lutando para conseguir o maior número de gatos e tomar o poder da lendária gangue. Será que você vai conseguir dominar essas feras?\"},\"Drag\":{\"title\":\"Drag Slay\",\"description\":\"Em Drag Slay, a correria nos bastidores é real. Você precisa ser rápida se quiser ser a primeira a subir no palco da AURA, a mais nova casa de shows da cidade, que promete ser a mais icônica de todas. Queens e Kings correndo pra todo lado: perucas voando, saltos perdidos, maquiagens pela metade… os bastidores estão fervendo! Cabe a você provar que é a mais ágil do lineup. SERÁ QUE ESTÁ PRONTA PARA O DESAFIO?\"},\"Galhos\":{\"title\":\"Galhos\",\"description\":\"Em Galhos, cada jogador controla uma árvore, e seu objetivo é fazer com que os galhos cresçam para atrair fadas que farão morada em sua copa. Aquele que conseguir 8 fadas primeiro vence o jogo.\"}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nc:null\n"])</script><script>self.__next_f.push([1,"d:null\n11:[[\"$\",\"title\",\"0\",{\"children\":\"Backstabbers | Solara Studios\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Em uma sociedade onde cada um quer ser mais poderoso que o outro e onde seus desejos são maiores que o próximo, ninguém medirá seus esforços para atingir seus objetivos. Não confie em ninguém, nem mesmo em você!\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"747x796\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/images/favicon.ico\"}]]\n"])</script></body></html>
